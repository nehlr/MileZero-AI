<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Knowledge Base</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-layout">
        
        <!-- Left Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">Indexed Documents</h2>
                <button class="toggle-btn" id="toggle-sidebar" aria-label="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
                </button>
            </div>
            
            <div class="document-list" id="document-list">
                <div class="loading-docs">Loading indexed files...</div>
            </div>

            <div class="upload-dropzone" id="dropzone">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Drag & drop files to index</span>
                <span class="upload-hint">TXT or PDF (UI Only)</span>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            
            <!-- Top Navigation Bar -->
            <header class="top-nav">
                <button class="toggle-btn" id="mobile-toggle" aria-label="Toggle Sidebar" style="margin-right: 16px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                
                <div class="nav-brand">
                    <h1 class="serif-title">Local RAG Workspace</h1>
                </div>
                
                <div class="nav-metrics" id="nav-metrics">
                    <div class="metric-badge primary-badge">
                        <span class="pulse-dot"></span>
                        <span class="metric-label" id="model-name">Loading...</span>
                    </div>
                    <div class="metric-badge hidden-mobile">
                        <span>RAM:</span> <strong id="ram-usage">--</strong>
                    </div>
                    <div class="metric-badge hidden-mobile">
                        <span>Latency:</span> <strong id="latency-ms">--</strong>
                    </div>
                </div>
            </header>

            <!-- Workspace -->
            <div class="workspace">
                <div class="chat-container">
                    <div id="chat-history" class="chat-history">
                        <div class="message assistant-message">
                            <div class="message-content">
                                <p>Welcome to the RAG workspace. The sidebar contains your indexed documents. Ask me anything to retrieve context.</p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Floating Bottom Command Bar -->
                <div class="command-bar-wrapper">
                    <form id="chat-form" class="command-bar">
                        <input type="text" id="query-input" placeholder="Query your local documents..." autocomplete="off" required>
                        <button type="submit" id="send-button" aria-label="Send Query">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                        </button>
                    </form>
                </div>
            </div>
            
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
